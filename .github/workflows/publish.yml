# Manual npm publish with provenance. Manual dispatch only: merging or
# tagging never publishes. Configure the "release" environment in GitHub
# (required reviewers) and either an npm trusted publisher for this
# workflow or an NPM_TOKEN secret in that environment before first use.
# See RELEASING.md for the full preconditions; this workflow enforces the
# machine-checkable ones (clean full gate + browser suite) and stops there.
name: publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the package version to confirm this is a deliberate release"
        required: true
        type: string
      commit:
        description: "Full 40-character SHA of the reviewed main commit to publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm provenance via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Require the reviewed main commit
        env:
          EXPECTED_RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_REF_IS_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main, not $GITHUB_REF" >&2
            exit 1
          fi
          if [[ "$RELEASE_REF_IS_PROTECTED" != "true" ]]; then
            echo "The main release ref must be protected by a branch rule or ruleset" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The release commit must be a full lowercase 40-character SHA" >&2
            exit 1
          fi
          if [[ "$EXPECTED_RELEASE_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "The approved release commit does not match the dispatched main commit" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Confirm version matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$version" != "${{ inputs.confirm }}" ]; then
            echo "package.json is $version, not ${{ inputs.confirm }}" >&2
            exit 1
          fi
      - name: Full check gate
        run: bash scripts/buildkite-check.sh regression
      - name: Browser suite on the exact release commit
        run: bash scripts/buildkite-check.sh browser
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

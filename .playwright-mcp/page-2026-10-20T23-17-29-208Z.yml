ore413; SDK256KiB configuration is not forwarded to the legacy adapter. Original Cursor security author is fixing bounded streaming and cancellation. No full green receipt or deployment is claimed. A fresh own native review session/checkpoint has exact remote proof, with recovered-native-only provenance and turn0-summary discrepancy, unauthenticated search and outdated hook limits recorded. It is not live-hook capture; prior warehouse capture gap and HOLD817 were not borrowed. Earlier four-audit pass remains historical. Current full security gates are stopped for this actionable source flaw. All four feature authors2965/2961/2973/2974 are integrating the independently reviewed fdabb MCP delta after Vite; current heads still require fresh freeze checks. Previously inspected2973 bounds changes remain preserved. Current scoped recovery: PR2975 final301e3f125d9d474530acb11083cb9de0a70c7d4f fixes bounded body streaming and async cancellation. Actual20 cases across both routes passed with zero unhandled errors; independent16-suite proof passed. A fresh own native checkpoint01M5DQ1AH3R5T94TSEP89R4RHD records this scoped work, not full E2E. Its first full run later failed ENOSPC during eval installation rather than an assertion; same unchanged301e original full retry3 is dispatched using command-scoped supported Python3.12 after retry2 gateway setup failure. Earlier passing stages are preserved but do not constitute full green. Prior fe2 intentional stop after812/20,714 and c05/797 unhandled failures remain historical evidence. Export/warehouse review independently reproduced PR2965 defects: sourceId filtering uses the two-source autopublish allowlist and drops registered human-review source nashville-metro-events-jsonapi; after successful audit, URL.createObjectURL failure leaves downloadPending true with an unhandled error. PR2961 rejects actual producer public verified places without verifiedAt and legacy curated stories with null publishedAt as publish_outcome_conflicts